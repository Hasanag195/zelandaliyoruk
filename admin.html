<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>zelandaliyoruk — Yönetim</title>
  <link rel="icon" type="image/jpeg" href="assets/logo.jpg" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .admin-wrap { padding: 40px 0; }
    .admin-gate { max-width: 320px; margin: 80px auto; text-align: center; }
    .admin-gate input { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 10px; font-family: inherit; }
    .admin-gate button { width: 100%; padding: 12px; border-radius: 10px; border: none; background: var(--primary); color: #fff; font-weight: 700; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: var(--radius); overflow: hidden; }
    th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 0.9rem; vertical-align: top; }
    th { background: var(--border); font-weight: 700; }
    .admin-meta { color: var(--muted); font-size: 0.9rem; margin-bottom: 16px; }
    .admin-err { color: #a3271d; font-size: 0.85rem; min-height: 1em; margin-bottom: 8px; }
    .admin-tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .admin-tab { padding: 9px 18px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; font-size: 0.9rem; font-weight: 600; color: var(--muted); }
    .admin-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .admin-panel { display: none; }
    .admin-panel.active { display: block; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">
        <img class="brand-logo" src="assets/logo.jpg" alt="zelandaliyoruk logo" />
        zelandaliyoruk
      </a>
    </div>
  </header>

  <div class="container admin-wrap">
    <div id="admin-gate" class="admin-gate">
      <h2>Yönetim Paneli</h2>
      <div class="admin-err" id="admin-err"></div>
      <input type="password" id="admin-key" placeholder="Erişim anahtarı" />
      <button id="admin-submit">Giriş</button>
    </div>

    <div id="admin-content" style="display:none">
      <div class="admin-tabs">
        <button class="admin-tab active" data-tab="leads">Kayıtlar</button>
        <button class="admin-tab" data-tab="questions">Sorular</button>
      </div>

      <div class="admin-panel active" id="panel-leads">
        <div class="admin-meta" id="leads-meta"></div>
        <table>
          <thead><tr><th>Ad Soyad</th><th>E-posta</th><th>Tarih</th></tr></thead>
          <tbody id="leads-rows"></tbody>
        </table>
      </div>

      <div class="admin-panel" id="panel-questions">
        <div class="admin-meta" id="questions-meta"></div>
        <table>
          <thead><tr><th>Ad Soyad</th><th>E-posta</th><th>Konu</th><th>Soru</th><th>Tarih</th></tr></thead>
          <tbody id="questions-rows"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const gate = document.getElementById("admin-gate");
    const content = document.getElementById("admin-content");
    const err = document.getElementById("admin-err");

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[c]));
    }

    async function loadAll(key) {
      err.textContent = "";
      const [leadsRes, questionsRes] = await Promise.all([
        fetch("/api/leads-list", { headers: { "X-Admin-Key": key } }),
        fetch("/api/questions-list", { headers: { "X-Admin-Key": key } }),
      ]);

      if (leadsRes.status === 401 || questionsRes.status === 401) {
        err.textContent = "Anahtar hatalı.";
        return false;
      }
      if (!leadsRes.ok || !questionsRes.ok) {
        err.textContent = "Veriler yüklenemedi.";
        return false;
      }

      const leadsData = await leadsRes.json();
      document.getElementById("leads-meta").textContent = `Toplam kayıt: ${leadsData.count}`;
      document.getElementById("leads-rows").innerHTML = leadsData.leads
        .map(
          (l) => `<tr>
            <td>${esc(l.name)}</td>
            <td>${esc(l.email)}</td>
            <td>${esc(new Date(l.ts).toLocaleString("tr-TR"))}</td>
          </tr>`
        )
        .join("");

      const questionsData = await questionsRes.json();
      document.getElementById("questions-meta").textContent = `Toplam soru: ${questionsData.count}`;
      document.getElementById("questions-rows").innerHTML = questionsData.questions
        .map(
          (q) => `<tr>
            <td>${esc(q.name)}</td>
            <td>${esc(q.email)}</td>
            <td>${esc(q.topic || "-")}</td>
            <td>${esc(q.question)}</td>
            <td>${esc(new Date(q.ts).toLocaleString("tr-TR"))}</td>
          </tr>`
        )
        .join("");

      gate.style.display = "none";
      content.style.display = "block";
      return true;
    }

    document.getElementById("admin-submit").addEventListener("click", async () => {
      const key = document.getElementById("admin-key").value.trim();
      if (!key) return;
      const ok = await loadAll(key);
      if (ok) sessionStorage.setItem("zy_admin_key", key);
    });

    document.querySelectorAll(".admin-tab").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".admin-tab").forEach((b) => b.classList.remove("active"));
        document.querySelectorAll(".admin-panel").forEach((p) => p.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById("panel-" + btn.dataset.tab).classList.add("active");
      });
    });

    const saved = sessionStorage.getItem("zy_admin_key");
    if (saved) loadAll(saved);
  </script>
</body>
</html>
