<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>zelandalıyoruk</title>
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">
        <img class="brand-logo" src="assets/logo.png" alt="zelandalıyoruk logo" />
        zelandalıyoruk
      </a>
      <nav class="social-links" id="social-links"></nav>
    </div>
  </header>

  <div class="container">
    <a class="back-link" href="index.html">&larr; Tüm konular</a>
    <section class="topic-detail" id="topic-detail"></section>
  </div>

  <footer class="site-footer">
    <div class="container">
      &copy; <span id="year"></span> zelandalıyoruk
    </div>
  </footer>

  <script src="data.js"></script>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    document.getElementById("social-links").innerHTML = `
      <a href="${SITE.channelUrl}" target="_blank" rel="noopener">YouTube</a>
      <a href="${SITE.instagramUrl}" target="_blank" rel="noopener">Instagram</a>
      <a href="${SITE.tiktokUrl}" target="_blank" rel="noopener">TikTok</a>
    `;

    const params = new URLSearchParams(location.search);
    const slug = params.get("t");
    const topic = TOPICS.find((t) => t.slug === slug);
    const detail = document.getElementById("topic-detail");

    if (!topic) {
      detail.innerHTML = `<div class="empty-state"><p>Konu bulunamadı.</p></div>`;
    } else {
      const videosHtml = topic.videos.length
        ? `<div class="video-grid">${topic.videos
            .map(
              (v) => `
              <div class="video-embed">
                <iframe src="https://www.youtube.com/embed/${v.id}" title="${v.title}" allowfullscreen></iframe>
                <div class="video-title">${v.title}</div>
              </div>`
            )
            .join("")}</div>`
        : `<div class="empty-state">
             <p>Bu konu için video yakında eklenecek.</p>
             <a href="${SITE.channelUrl}" target="_blank" rel="noopener">Kanalı ziyaret et &rarr;</a>
           </div>`;

      detail.innerHTML = `
        <h1>${topic.title}</h1>
        <p class="summary">${topic.summary}</p>
        ${videosHtml}
      `;
    }
  </script>
</body>
</html>
