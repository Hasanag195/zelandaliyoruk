<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>zelandaliyoruk</title>
  <meta name="description" content="Yeni Zelanda'ya yolculuk, vize, maaş ve günlük hayat hakkında konu başlıklarıyla video rehberi." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="zelandaliyoruk" />
  <meta property="og:title" content="zelandaliyoruk Yeni Zelanda Rehberi" />
  <meta property="og:description" content="Yeni Zelanda'ya yolculuk, vize, maaş ve günlük hayat hakkında konu başlıklarıyla video rehberi." />
  <meta property="og:image" content="https://zelandaliyoruk.com/assets/logo.jpg" />
  <meta name="twitter:card" content="summary" />
  <link rel="icon" type="image/jpeg" href="/assets/logo.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="/">
        <img class="brand-logo" src="/assets/logo.jpg" alt="zelandaliyoruk logo" />
        zelandaliyoruk
      </a>
      <div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap">
        <nav class="social-links" id="social-links"></nav>
        <div class="lang-switch" id="lang-switch"></div>
      </div>
    </div>
  </header>

  <main>
  <div class="container">
    <a class="back-link" href="/" id="back-link"></a>
    <section class="topic-detail" id="topic-detail"></section>
  </div>

  <div class="disclaimer">
    <div class="container">
      <strong id="disclaimer-label"></strong> <span id="disclaimer-text"></span>
    </div>
  </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      &copy; <span id="year"></span> zelandaliyoruk
    </div>
  </footer>

  <script defer src="/_vercel/insights/script.js"></script>
  <script src="/i18n.js"></script>
  <script src="/gate.js"></script>
  <script src="/data.js"></script>
  <script>
    const BASE = "";
    document.documentElement.lang = getLang();
    document.getElementById("year").textContent = new Date().getFullYear();
    document.getElementById("back-link").textContent = T("backToTopics");
    document.getElementById("disclaimer-label").textContent = T("disclaimerLabel");
    document.getElementById("disclaimer-text").textContent = T("disclaimer");

    const ICONS = {
      youtube: '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8ZM9.6 15.6V8.4L15.8 12l-6.2 3.6Z"/></svg>',
      instagram: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="2.5" y="2.5" width="19" height="19" rx="5"/><circle cx="12" cy="12" r="4.5"/><circle cx="17.5" cy="6.5" r="1.1" fill="currentColor" stroke="none"/></svg>',
      tiktok: '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M16.5 2h-3v13.6a3 3 0 1 1-2.2-2.9v-3.1a6.1 6.1 0 1 0 5.2 6V9.1a7.6 7.6 0 0 0 4.5 1.5V7.5a4.6 4.6 0 0 1-4.5-4.6V2Z"/></svg>',
    };
    document.getElementById("social-links").innerHTML = `
      <a href="${SITE.channelUrl}" target="_blank" rel="noopener">${ICONS.youtube}<span>YouTube</span></a>
      <a href="${SITE.instagramUrl}" target="_blank" rel="noopener">${ICONS.instagram}<span>Instagram</span></a>
      <a href="${SITE.tiktokUrl}" target="_blank" rel="noopener">${ICONS.tiktok}<span>TikTok</span></a>
    `;

    const params = new URLSearchParams(location.search);
    const slug = params.get("t");
    const topic = TOPICS.find((t) => t.slug === slug);
    const detail = document.getElementById("topic-detail");

    const qs = slug ? `?t=${slug}` : "";
    renderLangSwitch("lang-switch", { tr: `/topic.html${qs}`, en: `/en/topic.html${qs}` });
    if (slug) {
      const canonical = document.createElement("link");
      canonical.rel = "canonical";
      canonical.href = `https://zelandaliyoruk.com${BASE}/topic.html${qs}`;
      document.head.appendChild(canonical);
      [
        ["tr", `https://zelandaliyoruk.com/topic.html${qs}`],
        ["en", `https://zelandaliyoruk.com/en/topic.html${qs}`],
        ["x-default", `https://zelandaliyoruk.com/topic.html${qs}`],
      ].forEach(([hreflang, href]) => {
        const link = document.createElement("link");
        link.rel = "alternate";
        link.hreflang = hreflang;
        link.href = href;
        document.head.appendChild(link);
      });
    }

    if (!topic) {
      detail.innerHTML = `<div class="empty-state"><p>${T("notFound")}</p></div>`;
    } else {
      document.title = `${L(topic.title)} | zelandaliyoruk`;

      const videosHtml = topic.videos.length
        ? `<div class="video-grid">${topic.videos
            .map(
              (v) => `
              <div class="video-embed">
                <iframe src="https://www.youtube.com/embed/${v.id}" title="${v.title}" allowfullscreen></iframe>
                <div class="video-title">${v.title}</div>
              </div>`
            )
            .join("")}</div>`
        : `<div class="empty-state">
             <p>${T("videoComingSoon")}</p>
             <a href="${SITE.channelUrl}" target="_blank" rel="noopener">${T("visitChannel")}</a>
           </div>`;

      const escAttr = (s) => String(s).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[c]));
      const savedName = escAttr(localStorage.getItem("zy_lead_name") || "");
      const savedEmail = escAttr(localStorage.getItem("zy_lead_email") || "");

      const questionFormHtml = `
        <div class="ask-box">
          <h3>${T("askTitle")}</h3>
          <p>${T("askDesc")}</p>
          <form id="ask-form" novalidate>
            <input type="text" name="name" placeholder="${T("askNamePh")}" value="${savedName}" required />
            <input type="email" name="email" placeholder="${T("askEmailPh")}" value="${savedEmail}" required />
            <textarea name="question" placeholder="${T("askQuestionPh")}" rows="3" required></textarea>
            <input type="text" name="hp" class="gate-hp" tabindex="-1" autocomplete="off" />
            <button type="submit">${T("askSubmit")}</button>
            <div class="ask-msg" id="ask-msg"></div>
          </form>
        </div>
      `;

      const accordionHtml = topic.accordion
        ? topic.accordion
            .map(
              (group, gi) => `
              <div class="accordion">
                <button class="accordion-toggle${group.open ? " open" : ""}" data-idx="${gi}" type="button" aria-expanded="${group.open ? "true" : "false"}">
                  <span>${L(group.label)}</span>
                  <span class="accordion-chevron">⌄</span>
                </button>
                <div class="accordion-panel${group.open ? " open" : ""}" data-panel="${gi}">
                  ${group.items
                    .map((i) => {
                      const label = L(i.label);
                      const content = i.content ? L(i.content) : null;
                      if (i.url && content) {
                        return `
                      <div class="accordion-item accordion-item--info">
                        <p class="accordion-item-label">${label}</p>
                        <p class="accordion-item-content">${content}</p>
                        <a href="${i.url}" target="_blank" rel="noopener" class="accordion-item-link">${T("officialLink")} <span class="accordion-arrow">↗</span></a>
                      </div>`;
                      } else if (i.url) {
                        return `
                      <a href="${i.url}" target="_blank" rel="noopener">
                        <span>${label}</span>
                        <span class="accordion-arrow">↗</span>
                      </a>`;
                      } else if (content) {
                        return `
                      <div class="accordion-item accordion-item--info">
                        <p class="accordion-item-label">${label}</p>
                        <p class="accordion-item-content">${content}</p>
                      </div>`;
                      } else {
                        return `
                      <div class="accordion-item">
                        <span>${label}</span>
                      </div>`;
                      }
                    })
                    .join("")}
                </div>
              </div>`
            )
            .join("")
        : "";

      const shareText = encodeURIComponent(`${L(topic.title)} (zelandaliyoruk)\n${location.href}`);

      detail.innerHTML = `
        <span class="eyebrow">${T("topicsEyebrow")}</span>
        <h1>${L(topic.title)}</h1>
        <p class="summary">${L(topic.summary)}</p>
        ${topic.intro ? `<p class="topic-intro">${L(topic.intro)}</p>` : ""}
        <a class="share-btn" href="https://wa.me/?text=${shareText}" target="_blank" rel="noopener">${T("shareBtn")}</a>
        ${topic.inzWatch ? `<div class="inz-status" id="inz-status">${T("inzChecking")}</div>` : ""}
        ${accordionHtml}
        ${videosHtml}
        ${questionFormHtml}
      `;

      detail.querySelectorAll(".accordion-toggle").forEach((btn) => {
        btn.addEventListener("click", () => {
          const panel = detail.querySelector(`.accordion-panel[data-panel="${btn.dataset.idx}"]`);
          const isOpen = panel.classList.toggle("open");
          btn.classList.toggle("open", isOpen);
          btn.setAttribute("aria-expanded", String(isOpen));
        });
      });

      const askForm = document.getElementById("ask-form");
      const askMsg = document.getElementById("ask-msg");
      askForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        askMsg.textContent = "";
        askMsg.className = "ask-msg";
        const data = new FormData(askForm);
        const name = data.get("name").trim();
        const email = data.get("email").trim();
        const question = data.get("question").trim();
        const hp = data.get("hp").trim();

        if (!name || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) || !question) {
          askMsg.textContent = T("askValidation");
          askMsg.classList.add("ask-msg--error");
          return;
        }

        const btn = askForm.querySelector("button");
        btn.disabled = true;
        btn.textContent = T("askSending");

        try {
          const res = await fetch("/api/questions", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, email, question, topic: L(topic.title), hp }),
          });
          if (!res.ok) throw new Error("failed");
          askForm.reset();
          askMsg.textContent = T("askOk");
          askMsg.classList.add("ask-msg--ok");
        } catch (err) {
          askMsg.textContent = T("askErr");
          askMsg.classList.add("ask-msg--error");
        } finally {
          btn.disabled = false;
          btn.textContent = T("askSubmit");
        }
      });

      if (topic.inzWatch) {
        fetch("/api/inz-status")
          .then((r) => r.json())
          .then((data) => {
            const el = document.getElementById("inz-status");
            if (!el) return;
            const checked = new Date(data.checkedAt).toLocaleDateString(getLang() === "en" ? "en-NZ" : "tr-TR");
            el.textContent = Tf(data.anyChanged ? "inzChanged" : "inzOk", { d: checked });
            el.classList.add(data.anyChanged ? "inz-status--changed" : "inz-status--ok");
          })
          .catch(() => {
            const el = document.getElementById("inz-status");
            if (el) el.remove();
          });
      }
    }
  </script>
</body>
</html>
