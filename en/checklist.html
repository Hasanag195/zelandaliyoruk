<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>zelandaliyoruk New Zealand Journey Checklist</title>
  <meta name="description" content="A step-by-step checklist for moving from Turkey to New Zealand: pre-visa prep, application, before you leave, first week, and finding work." />
  <link rel="canonical" href="https://zelandaliyoruk.com/en/checklist.html" />
  <link rel="alternate" hreflang="tr" href="https://zelandaliyoruk.com/checklist.html" />
  <link rel="alternate" hreflang="en" href="https://zelandaliyoruk.com/en/checklist.html" />
  <link rel="alternate" hreflang="x-default" href="https://zelandaliyoruk.com/checklist.html" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="zelandaliyoruk" />
  <meta property="og:title" content="New Zealand Journey Checklist" />
  <meta property="og:description" content="A step-by-step checklist for moving from Turkey to New Zealand." />
  <meta property="og:image" content="https://zelandaliyoruk.com/assets/logo.jpg" />
  <meta name="twitter:card" content="summary" />
  <link rel="icon" type="image/jpeg" href="/assets/logo.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <style>
    .cl-header { text-align: center; padding: 56px 0 8px; }
    .cl-progress-wrap { max-width: 480px; margin: 0 auto 8px; }
    .cl-progress-bar { height: 10px; border-radius: 999px; background: var(--border); overflow: hidden; }
    .cl-progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.25s ease; }
    .cl-progress-text { text-align: center; font-size: 0.85rem; color: var(--muted); margin: 8px 0 0; }
    .cl-actions { display: flex; justify-content: center; gap: 10px; margin: 20px 0 40px; flex-wrap: wrap; }
    .cl-btn { padding: 11px 22px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--primary-dark); font-weight: 700; font-size: 0.85rem; cursor: pointer; text-decoration: none; box-shadow: var(--shadow-sm); }
    .cl-btn:hover { border-color: var(--accent); }
    .cl-btn--primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    .cl-btn--primary:hover { background: var(--primary-dark); }
    .cl-section { margin-bottom: 40px; }
    .cl-section h2 { font-size: 1.3rem; font-weight: 600; color: var(--primary-dark); margin: 0 0 4px; }
    .cl-section .cl-desc { color: var(--muted); font-size: 0.9rem; margin: 0 0 16px; }
    .cl-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .cl-item { display: flex; align-items: flex-start; gap: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow-sm); }
    .cl-item input[type="checkbox"] { margin-top: 3px; width: 18px; height: 18px; accent-color: var(--primary); flex: none; cursor: pointer; }
    .cl-item label { flex: 1; font-size: 0.94rem; line-height: 1.5; cursor: pointer; }
    .cl-item.checked label { color: var(--muted); text-decoration: line-through; }
    .cl-item a { color: var(--accent); font-weight: 600; text-decoration: none; }
    .cl-item a:hover { text-decoration: underline; }

    @media print {
      .site-header, .disclaimer, .site-footer, .cl-actions, #ask-inline, .gate-overlay { display: none !important; }
      body { background: #fff; }
      .cl-item { box-shadow: none; border: 1px solid #ccc; }
      .cl-progress-wrap { display: none; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="/en/">
        <img class="brand-logo" src="/assets/logo.jpg" alt="zelandaliyoruk logo" />
        zelandaliyoruk
      </a>
      <div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap">
        <nav class="social-links" id="social-links"></nav>
        <div class="lang-switch" id="lang-switch"></div>
      </div>
    </div>
  </header>

  <main>
  <div class="container">
    <a class="back-link" href="/en/" id="back-link"></a>

    <div class="cl-header">
      <span class="eyebrow" id="cl-eyebrow"></span>
      <h1 id="cl-title"></h1>
      <p style="max-width:560px;margin:12px auto 0;color:var(--muted)" id="cl-desc-text"></p>
    </div>

    <div class="cl-progress-wrap">
      <div class="cl-progress-bar"><div class="cl-progress-fill" id="cl-progress-fill"></div></div>
      <p class="cl-progress-text" id="cl-progress-text"></p>
    </div>

    <div class="cl-actions">
      <button class="cl-btn cl-btn--primary" onclick="window.print()" id="cl-print-btn"></button>
      <button class="cl-btn" id="cl-reset"></button>
    </div>

    <div id="cl-sections"></div>
  </div>

  <div class="disclaimer">
    <div class="container">
      <strong id="disclaimer-label"></strong> <span id="disclaimer-text"></span>
    </div>
  </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      &copy; <span id="year"></span> zelandaliyoruk
    </div>
  </footer>

  <script defer src="/_vercel/insights/script.js"></script>
  <script>window.__FORCE_LANG = "en";</script>
  <script src="/i18n.js"></script>
  <script src="/gate.js"></script>
  <script src="/data.js"></script>
  <script src="/checklist-data.js"></script>
  <script>
    const BASE = "/en";
    document.documentElement.lang = getLang();
    document.getElementById("year").textContent = new Date().getFullYear();
    renderLangSwitch("lang-switch", { tr: "/checklist.html", en: "/en/checklist.html" });

    document.getElementById("back-link").textContent = T("backToTopics");
    document.getElementById("cl-eyebrow").textContent = T("clEyebrow");
    document.getElementById("cl-title").textContent = T("clTitle");
    document.getElementById("cl-desc-text").textContent = T("clDesc");
    document.getElementById("cl-print-btn").textContent = T("clPrint");
    document.getElementById("cl-reset").textContent = T("clReset");
    document.getElementById("disclaimer-label").textContent = T("disclaimerLabel");
    document.getElementById("disclaimer-text").textContent = T("disclaimer");

    const ICONS = {
      youtube: '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8ZM9.6 15.6V8.4L15.8 12l-6.2 3.6Z"/></svg>',
      instagram: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="2.5" y="2.5" width="19" height="19" rx="5"/><circle cx="12" cy="12" r="4.5"/><circle cx="17.5" cy="6.5" r="1.1" fill="currentColor" stroke="none"/></svg>',
      tiktok: '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M16.5 2h-3v13.6a3 3 0 1 1-2.2-2.9v-3.1a6.1 6.1 0 1 0 5.2 6V9.1a7.6 7.6 0 0 0 4.5 1.5V7.5a4.6 4.6 0 0 1-4.5-4.6V2Z"/></svg>',
    };
    document.getElementById("social-links").innerHTML = `
      <a href="${SITE.channelUrl}" target="_blank" rel="noopener">${ICONS.youtube}<span>YouTube</span></a>
      <a href="${SITE.instagramUrl}" target="_blank" rel="noopener">${ICONS.instagram}<span>Instagram</span></a>
      <a href="${SITE.tiktokUrl}" target="_blank" rel="noopener">${ICONS.tiktok}<span>TikTok</span></a>
    `;

    const STORAGE_KEY = "zy_checklist_v1";
    const state = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function updateProgress() {
      const all = document.querySelectorAll(".cl-item input[type=checkbox]");
      const checked = document.querySelectorAll(".cl-item input[type=checkbox]:checked");
      document.getElementById("cl-progress-fill").style.width = (all.length ? Math.round((checked.length / all.length) * 100) : 0) + "%";
      document.getElementById("cl-progress-text").textContent = Tf("clProgress", { n: checked.length, t: all.length });
    }

    const list = CHECKLIST[getLang()] || CHECKLIST.tr;
    const sectionsEl = document.getElementById("cl-sections");
    sectionsEl.innerHTML = list.map((section, si) => `
      <div class="cl-section">
        <h2>${section.title}</h2>
        <p class="cl-desc">${section.desc}</p>
        <ul class="cl-list">
          ${section.items
            .map((item, ii) => {
              const id = `cl-${si}-${ii}`;
              const linkHref = item.link && item.link[1].startsWith("http") ? item.link[1] : `${BASE}/${item.link ? item.link[1] : ""}`;
              const linkHtml = item.link
                ? ` · <a href="${linkHref}" target="_blank" rel="noopener">${item.link[0]} &rarr;</a>`
                : "";
              return `
                <li class="cl-item" id="wrap-${id}">
                  <input type="checkbox" id="${id}" />
                  <label for="${id}">${item.t}${linkHtml}</label>
                </li>`;
            })
            .join("")}
        </ul>
      </div>
    `).join("");

    document.querySelectorAll(".cl-item input[type=checkbox]").forEach((cb) => {
      const key = cb.id;
      cb.checked = !!state[key];
      cb.closest(".cl-item").classList.toggle("checked", cb.checked);
      cb.addEventListener("change", () => {
        state[key] = cb.checked;
        save();
        cb.closest(".cl-item").classList.toggle("checked", cb.checked);
        updateProgress();
      });
    });
    updateProgress();

    document.getElementById("cl-reset").addEventListener("click", () => {
      if (!confirm(T("clResetConfirm"))) return;
      localStorage.removeItem(STORAGE_KEY);
      location.reload();
    });
  </script>
</body>
</html>
