<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>zelandaliyoruk</title>
  <link rel="canonical" href="https://zelandaliyoruk.com/en/" />
  <script>
    // Old /en/topic.html?t=<slug> URLs now live at static /en/t/<slug>.html pages.
    (function () {
      var slug = new URLSearchParams(location.search).get("t");
      var base = location.pathname.indexOf("/en/") === 0 ? "/en" : "";
      var target = slug && /^[a-z0-9-]+$/.test(slug) ? base + "/t/" + slug + ".html" : base + "/";
      location.replace(target);
    })();
  </script>
</head>
