<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>zelandaliyoruk Yeni Zelanda Rehberi</title>
  <meta name="description" content="Yeni Zelanda'ya yolculuk, vize, maaş ve günlük hayat hakkında konu başlıklarıyla kapsamlı rehber." />
  <link rel="canonical" href="https://zelandaliyoruk.com/" />
  <link rel="alternate" hreflang="tr" href="https://zelandaliyoruk.com/" />
  <link rel="alternate" hreflang="en" href="https://zelandaliyoruk.com/en/" />
  <link rel="alternate" hreflang="x-default" href="https://zelandaliyoruk.com/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="zelandaliyoruk" />
  <meta property="og:title" content="zelandaliyoruk Yeni Zelanda Rehberi" />
  <meta property="og:description" content="Yeni Zelanda'ya yolculuk, vize, maaş ve günlük hayat hakkında konu başlıklarıyla kapsamlı rehber." />
  <meta property="og:image" content="https://zelandaliyoruk.com/assets/yt-banner.png" />
  <meta property="og:image:width" content="2048" />
  <meta property="og:image:height" content="1152" />
  <meta name="twitter:image" content="https://zelandaliyoruk.com/assets/yt-banner.png" />
  <meta property="og:url" content="https://zelandaliyoruk.com/" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" type="image/jpeg" href="/assets/logo.jpg" />
  <link rel="apple-touch-icon" href="/assets/logo.jpg" />
  <meta name="theme-color" content="#0c4a30" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "zelandaliyoruk",
    "url": "https://zelandaliyoruk.com/",
    "logo": "https://zelandaliyoruk.com/assets/logo.jpg",
    "sameAs": [
      "https://www.youtube.com/@zelandalıyoruk",
      "https://www.instagram.com/zelandaliyoruk",
      "https://www.tiktok.com/@zelandaliyoruk"
    ]
  }
  </script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="/">
        <picture><source srcset="/assets/logo.webp" type="image/webp" /><img class="brand-logo" src="/assets/logo.jpg" alt="zelandaliyoruk logo" /></picture>
        zelandaliyoruk
      </a>
      <div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap">
        <nav class="social-links" id="social-links"></nav>
        <div class="lang-switch" id="lang-switch"></div>
      </div>
    </div>
  </header>

  <main>
  <section class="hero">
    <div class="container">
      <span class="hero-eyebrow" id="hero-eyebrow"></span>
      <h1 id="hero-title"></h1>
      <p id="hero-subtitle"></p>
      <div class="hero-stats" id="hero-stats"></div>
    </div>
  </section>

  <section class="container" style="padding-bottom: 8px">
    <a href="/checklist.html" class="cta-banner" id="cta-link">
      <div>
        <span class="eyebrow" style="color:#fff" id="cta-eyebrow"></span>
        <h3 id="cta-title"></h3>
        <p id="cta-subtitle"></p>
      </div>
      <span class="cta-banner-arrow">→</span>
    </a>
  </section>

  <section class="topics">
    <div class="container">
      <span class="eyebrow" id="topics-eyebrow"></span>
      <h2 id="topics-heading"></h2>
      <div class="topic-search">
        <input type="search" id="topic-search-input" autocomplete="off" />
      </div>
      <p class="topic-search-empty" id="topic-search-empty" hidden></p>
      <div class="topic-grid" id="topic-grid"></div>
    </div>
  </section>

  <section class="container" style="padding-bottom: 48px">
    <div class="ask-box" style="margin-top: 0">
      <h3 id="ask-title"></h3>
      <p id="ask-desc"></p>
      <form id="ask-form" novalidate>
        <label class="sr-only" for="ask-name" id="ask-name-label"></label>
        <input type="text" name="name" id="ask-name" required />
        <label class="sr-only" for="ask-email" id="ask-email-label"></label>
        <input type="email" name="email" id="ask-email" required />
        <label class="sr-only" for="ask-question" id="ask-question-label"></label>
        <textarea name="question" id="ask-question" rows="3" required></textarea>
        <input type="text" name="hp" class="gate-hp" tabindex="-1" autocomplete="off" />
        <label class="gate-consent">
          <input type="checkbox" name="consent" id="ask-consent" required />
          <span id="ask-consent-text"></span>
        </label>
        <button type="submit" id="ask-submit"></button>
        <div class="ask-msg" id="ask-msg" aria-live="polite"></div>
      </form>
      <p class="gate-privacy" id="ask-notice"></p>
    </div>
  </section>

  <div class="disclaimer">
    <div class="container">
      <strong id="disclaimer-label"></strong> <span id="disclaimer-text"></span>
    </div>
  </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      &copy; <span id="year"></span> zelandaliyoruk · <a id="footer-privacy-link"></a> · <a id="footer-terms-link"></a>
    </div>
  </footer>

  <script defer src="/_vercel/insights/script.js"></script>
  <script src="/i18n.js"></script>
  <script src="/gate.js"></script>
  <script src="/data.js"></script>
  <script>
    const BASE = "";
    document.documentElement.lang = getLang();
    document.getElementById("year").textContent = new Date().getFullYear();
    document.getElementById("footer-privacy-link").href = getLang() === "en" ? "/en/privacy.html" : "/privacy.html";
    document.getElementById("footer-privacy-link").textContent = T("footerPrivacy");
    document.getElementById("footer-terms-link").href = getLang() === "en" ? "/en/terms.html" : "/terms.html";
    document.getElementById("footer-terms-link").textContent = T("footerTerms");
    renderLangSwitch("lang-switch", { tr: "/", en: "/en/" });
    document.getElementById("cta-link").href = `${BASE}/checklist.html`;

    document.getElementById("hero-eyebrow").textContent = T("heroEyebrow");
    document.getElementById("hero-title").textContent = T("heroTitle");
    document.getElementById("hero-subtitle").textContent = T("heroSubtitle");
    const heroShareText = encodeURIComponent(`zelandaliyoruk.com — ${T("heroSubtitle")}\nhttps://zelandaliyoruk.com`);
    document.getElementById("hero-stats").innerHTML =
      T("heroStats")
        .map((s) => `<div class="hero-stat"><span class="hero-stat-num">${s.n}</span><span class="hero-stat-label">${s.l}</span></div>`)
        .join("") +
      `<a class="hero-stat hero-stat--share" href="https://wa.me/?text=${heroShareText}" target="_blank" rel="noopener">${T("heroShare")}</a>`;

    fetch("/api/channel-stats")
      .then((r) => r.json())
      .then((data) => {
        if (!data.ok) return;
        const num = document.querySelector("#hero-stats .hero-stat-num");
        if (num) num.textContent = data.subscribers.toLocaleString("tr-TR");
      })
      .catch(() => {});
    document.getElementById("cta-eyebrow").textContent = T("ctaEyebrow");
    document.getElementById("cta-title").textContent = T("ctaTitle");
    document.getElementById("cta-subtitle").textContent = T("ctaSubtitle");
    document.getElementById("topics-eyebrow").textContent = T("topicsEyebrow");
    document.getElementById("topics-heading").textContent = T("topicsHeading");
    document.getElementById("ask-title").textContent = T("askTitle");
    document.getElementById("ask-desc").textContent = T("askDesc");
    document.getElementById("ask-name").placeholder = T("askNamePh");
    document.getElementById("ask-name-label").textContent = T("askNamePh");
    document.getElementById("ask-email").placeholder = T("askEmailPh");
    document.getElementById("ask-email-label").textContent = T("askEmailPh");
    document.getElementById("ask-question").placeholder = T("askQuestionPh");
    document.getElementById("ask-question-label").textContent = T("askQuestionPh");
    document.getElementById("ask-submit").textContent = T("askSubmit");
    document.getElementById("ask-consent-text").innerHTML =
      T("askConsentPre") +
      `<a href="${getLang() === "en" ? "/en/privacy.html" : "/privacy.html"}" target="_blank" rel="noopener">${T("askConsentLink")}</a>` +
      T("askConsentPost");
    document.getElementById("ask-notice").textContent = T("askNotice");
    document.getElementById("disclaimer-label").textContent = T("disclaimerLabel");
    document.getElementById("disclaimer-text").textContent = T("disclaimer");

    const ICONS = {
      youtube: '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8ZM9.6 15.6V8.4L15.8 12l-6.2 3.6Z"/></svg>',
      instagram: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="2.5" y="2.5" width="19" height="19" rx="5"/><circle cx="12" cy="12" r="4.5"/><circle cx="17.5" cy="6.5" r="1.1" fill="currentColor" stroke="none"/></svg>',
      tiktok: '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M16.5 2h-3v13.6a3 3 0 1 1-2.2-2.9v-3.1a6.1 6.1 0 1 0 5.2 6V9.1a7.6 7.6 0 0 0 4.5 1.5V7.5a4.6 4.6 0 0 1-4.5-4.6V2Z"/></svg>',
    };
    document.getElementById("social-links").innerHTML = `
      <a href="${SITE.channelUrl}" target="_blank" rel="noopener">${ICONS.youtube}<span>YouTube</span></a>
      <a href="${SITE.instagramUrl}" target="_blank" rel="noopener">${ICONS.instagram}<span>Instagram</span></a>
      <a href="${SITE.tiktokUrl}" target="_blank" rel="noopener">${ICONS.tiktok}<span>TikTok</span></a>
    `;

    const grid = document.getElementById("topic-grid");
    const searchInput = document.getElementById("topic-search-input");
    const searchEmpty = document.getElementById("topic-search-empty");
    searchInput.placeholder = T("topicSearchPh");
    searchEmpty.textContent = T("topicSearchEmpty");

    const norm = (s) => (s || "").toLocaleLowerCase("tr").normalize("NFD").replace(/[̀-ͯ]/g, "");
    const topicSearchIndex = TOPICS.map((t) => {
      const accordionText = (t.accordion || [])
        .flatMap((g) => [L(g.label), ...g.items.map((i) => L(i.label))])
        .join(" ");
      return norm([L(t.title), L(t.summary), accordionText].join(" "));
    });

    function renderGrid(query) {
      const q = norm(query || "");
      let shown = 0;
      grid.innerHTML = TOPICS.map((t, i) => {
        const match = !q || topicSearchIndex[i].includes(q);
        if (match) shown++;
        return `
        <a class="topic-card" href="${BASE}/t/${t.slug}.html"${match ? "" : ' hidden'}>
          <span class="topic-card-index">${String(i + 1).padStart(2, "0")}</span>
          <h3>${L(t.title)}</h3>
          <p>${L(t.summary)}</p>
        </a>
      `;
      }).join("");
      searchEmpty.hidden = shown > 0;
    }
    renderGrid("");
    searchInput.addEventListener("input", (e) => renderGrid(e.target.value));

    const askForm = document.getElementById("ask-form");
    askForm.querySelector('input[name="name"]').value = localStorage.getItem("zy_lead_name") || "";
    askForm.querySelector('input[name="email"]').value = localStorage.getItem("zy_lead_email") || "";
    const askMsg = document.getElementById("ask-msg");

    askForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      askMsg.textContent = "";
      askMsg.className = "ask-msg";
      const data = new FormData(askForm);
      const name = data.get("name").trim();
      const email = data.get("email").trim();
      const question = data.get("question").trim();
      const hp = data.get("hp").trim();
      const consent = data.get("consent") === "on";

      if (!name || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) || !question) {
        askMsg.textContent = T("askValidation");
        askMsg.classList.add("ask-msg--error");
        return;
      }
      if (!consent) {
        askMsg.textContent = T("askConsentErr");
        askMsg.classList.add("ask-msg--error");
        return;
      }

      const btn = askForm.querySelector("button");
      btn.disabled = true;
      btn.textContent = T("askSending");

      try {
        const res = await fetch("/api/questions", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, email, question, topic: "Ana Sayfa (Genel)", hp, consent }),
        });
        if (!res.ok) throw new Error("failed");
        askForm.reset();
        askMsg.textContent = T("askOk");
        askMsg.classList.add("ask-msg--ok");
      } catch (err) {
        askMsg.textContent = T("askErr");
        askMsg.classList.add("ask-msg--error");
      } finally {
        btn.disabled = false;
        btn.textContent = T("askSubmit");
      }
    });
  </script>
</body>
</html>
